<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>JISANBD6666 - Login</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background: #050505;
            color: white;
            font-family: Arial, sans-serif;
        }

        .header {
            height: 65px;
            background: #101010;
            border-bottom: 1px solid #00ff66;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 7%;
        }

        .logo {
            color: #00ff66;
            font-size: 22px;
            font-weight: bold;
        }

        .container {
            width: 95%;
            max-width: 500px;
            margin: 50px auto;
        }

        .box {
            background: #111;
            border: 1px solid #00ff66;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.15);
        }

        h2 {
            text-align: center;
            color: #00ff66;
            margin-top: 0;
        }

        input {
            width: 100%;
            padding: 13px;
            margin: 7px 0;
            border: none;
            border-radius: 6px;
            background: #222;
            color: white;
            outline: none;
        }

        input:focus {
            border: 1px solid #00ff66;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 10px;
            border: none;
            border-radius: 6px;
            background: #00ff66;
            color: #000;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #00dd55;
        }

        .info {
            text-align: center;
            color: #aaa;
            margin-top: 15px;
        }

        .info a {
            color: #00ff66;
            text-decoration: none;
        }

    </style>

</head>

<body>


    <header class="header">

        <div class="logo">
            JISANBD6666
        </div>

    </header>


    <div class="container">


        <!-- LOGIN -->

        <div class="box">

            <h2>Login</h2>

            <form id="loginForm">

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Email Address"
                    required
                >

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Password"
                    required
                >

                <button type="submit">
                    Login
                </button>

            </form>

        </div>



        <!-- CREATE ACCOUNT -->

        <div class="box">

            <h2>Create Account</h2>

            <form id="registerForm">

                <input
                    type="text"
                    id="registerName"
                    placeholder="Full Name"
                    required
                >

                <input
                    type="email"
                    id="registerEmail"
                    placeholder="Email Address"
                    required
                >

                <input
                    type="tel"
                    id="registerMobile"
                    placeholder="Mobile Number"
                    required
                >

                <input
                    type="password"
                    id="registerPassword"
                    placeholder="Password (minimum 6 characters)"
                    required
                >

                <button type="submit">
                    Create Account
                </button>

            </form>

        </div>


        <div class="info">

            Account থাকলে উপরের Login ব্যবহার করুন।

        </div>


    </div>


    <!-- Firebase / Script -->

    <script
        type="module"
        src="./script.js">
    </script>


</body>

</html>
