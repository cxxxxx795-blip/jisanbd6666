<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JISANBD6666 - Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         LOGIN PAGE HEADER
    ========================== -->

    <header class="top-header">

        <a href="login.html" class="brand">
            JISANBD6666
        </a>

    </header>


    <!-- =========================
         LOGIN PAGE
    ========================== -->

    <main class="auth-page">

        <div class="auth-wrapper">


            <!-- BIG BRAND -->

            <div class="auth-brand">

                <div class="auth-logo">
                    JISANBD6666
                </div>

                <p>
                    🎮 Welcome to the Gaming World
                </p>

            </div>


            <!-- =====================
                 LOGIN CARD
            ====================== -->

            <section class="auth-card">

                <div class="auth-icon">
                    🔐
                </div>

                <h1>
                    Welcome Back
                </h1>

                <p class="auth-subtitle">
                    Login to continue
                </p>


                <form id="loginForm">

                    <label for="loginEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >


                    <label for="loginPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >


                    <button
                        type="submit"
                        class="primary-btn">

                        LOGIN

                    </button>

                </form>


                <div class="auth-divider">
                    <span>OR</span>
                </div>


                <p class="switch-text">

                    Don't have an account?

                    <a href="#register">
                        Create Account
                    </a>

                </p>

            </section>



            <!-- =====================
                 REGISTER CARD
            ====================== -->

            <section
                class="auth-card register-card"
                id="register">

                <div class="auth-icon">
                    👤
                </div>

                <h2>
                    Create Account
                </h2>

                <p class="auth-subtitle">
                    Join JISANBD6666
                </p>


                <form id="registerForm">


                    <label for="registerName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="registerName"
                        placeholder="Enter your full name"
                        required
                    >


                    <label for="registerEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="registerEmail"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >


                    <label for="registerMobile">
                        Mobile Number
                    </label>

                    <input
                        type="tel"
                        id="registerMobile"
                        placeholder="Enter mobile number"
                        required
                    >


                    <label for="registerPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="registerPassword"
                        placeholder="Minimum 6 characters"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >


                    <button
                        type="submit"
                        class="primary-btn">

                        CREATE ACCOUNT

                    </button>

                </form>

            </section>


            <!-- =====================
                 INFO
            ====================== -->

            <div class="auth-info">

                <span>🎮 Games</span>

                <span>💰 Deposit</span>

                <span>💸 Withdraw</span>

                <span>🏆 Rewards</span>

            </div>

        </div>

    </main>


    <!-- =========================
         FOOTER
    ========================== -->

    <footer class="site-footer">

        <strong>
            JISANBD6666
        </strong>

        <p>
            Play Responsibly
        </p>

        <p>
            © 2026 JISANBD6666
        </p>

    </footer>


    <!-- =========================
         FIREBASE SCRIPT
    ========================== -->

    <script
        type="module"
        src="./script.js">
    </script>

</body>

</html>
